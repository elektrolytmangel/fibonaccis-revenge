name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  requirements:
    name: requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 scripts/reqs.py
      - name: Traceability matrix in run summary
        if: always()
        run: cat docs/requirements/TRACEABILITY.md >> "$GITHUB_STEP_SUMMARY"

  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect app
        id: app
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No package.json yet; skipping."; fi
      - uses: actions/setup-node@v7
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.app.outputs.present == 'true'
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
