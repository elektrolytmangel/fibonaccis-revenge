name: Deploy to Azure Static Web Apps

# Needs the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN (the deployment
# token of the Static Web App: Azure portal > Static Web App > Manage deployment token).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-azure
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy dist/ to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          # The app is built above, so the action only uploads the finished output.
          skip_app_build: true
          app_location: dist
