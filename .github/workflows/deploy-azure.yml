name: Deploy to Azure Static Web Apps

# Needs:
# - secret AZURE_STATIC_WEB_APPS_API_TOKEN (Azure portal > Static Web App >
#   Manage deployment token)
# - repository variable KITH_RELAY_URL, a wss:// URL such as wss://relay.example.com/v1/ws
#   (Settings > Secrets and variables > Actions > Variables). It is baked into the
#   build as VITE_KITH_RELAY.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-azure
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check relay URL
        env:
          KITH_RELAY_URL: ${{ vars.KITH_RELAY_URL }}
        run: |
          case "$KITH_RELAY_URL" in
            wss://*) ;;
            *) echo "::error::Repository variable KITH_RELAY_URL must be set to a wss:// URL (got '$KITH_RELAY_URL')."; exit 1 ;;
          esac
      - run: pnpm build
        env:
          VITE_KITH_RELAY: ${{ vars.KITH_RELAY_URL }}
      - name: Deploy dist/ to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          # The app is built above, so the action only uploads the finished output.
          skip_app_build: true
          app_location: dist
